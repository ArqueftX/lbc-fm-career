<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LBC FM26 — Saison</title>
  <link rel="stylesheet" href="../style.css"/>
</head>
<body>
<div id="career-modal-host"></div>
<div class="sticky-nav">
  <a href="./" class="bc nav-btn">← TOUTES LES SAISONS</a>
  <div id="nav-title" class="bb nav-title"></div>
  <div id="sw-host"></div>
</div>
<div id="hero" class="hero" style="position:relative;background:linear-gradient(150deg,var(--blue) 0%,var(--navy) 55%);padding:70px 56px 80px;overflow:hidden"></div>
<div class="page-content" style="max-width:1160px;margin:0 auto;padding:64px 56px 100px">
  <div style="margin-bottom:60px">
    <div id="matches-title" class="bc sec-title"></div>
    <div id="matches-dots"></div>
  </div>
  <div id="big-stats" style="display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:64px" class="stat-strip"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-bottom:64px" class="two-col">
    <div>
      <div id="scorers"></div>
      <div id="ratings" style="margin-top:44px"></div>
    </div>
    <div>
      <div id="assists"></div>
      <div id="mercato-preview" style="margin-top:44px"></div>
    </div>
  </div>
  <div id="cup-section" style="margin-bottom:60px"></div>
  <div id="cup2-section" style="margin-bottom:60px"></div>
  <div id="playoffs-section" style="margin-bottom:64px"></div>
  <div id="standings-section" style="margin-bottom:60px"></div>
  <div id="promo-releg"></div>
</div>
<script>window.FORCE_CAREER = "seville"</script>
<script src="../careers.js"></script>
<script src="../seasons-chateauroux.js"></script>
<script src="../seasons-seville.js"></script>
<script src="../seasons-wolfsburg.js"></script>
<script src="../utils.js"></script>
<script>
const id = param('id')

loadCareerData(function(career) {
  const season = getSeason(id)
  if (!season) { window.location='./'; return; }
  const s = season

  // Switcher
  document.getElementById('sw-host').innerHTML = renderSwitcherBtn()
  document.getElementById('career-modal-host').innerHTML = renderCareerSwitcher()

  // Nav
  document.getElementById('nav-title').textContent = s.year + ' · ' + s.league
  document.title = s.year + ' ' + s.league + ' — FM26'

  // Hero
  const gdVal = s.gf - s.ga
  const gdStr = gdVal >= 0 ? '+'+gdVal : ''+gdVal
  document.getElementById('hero').innerHTML = `
    <div class="bb" style="position:absolute;right:-20px;top:50%;transform:translateY(-50%);font-size:clamp(160px,28vw,440px);color:rgba(12,34,89,.6);line-height:1;pointer-events:none;user-select:none">${s.position}</div>
    <div style="max-width:1160px;margin:0 auto;position:relative">
      <div class="bc au" style="font-size:10px;letter-spacing:6px;color:var(--gold);margin-bottom:14px;font-weight:600">BILAN DE SAISON · ${s.league}</div>
      <h1 class="bb au au1" style="font-size:clamp(44px,7.5vw,96px);line-height:.88;letter-spacing:2px;margin-bottom:10px">
        ${career.name.split(' ').slice(0, Math.ceil(career.name.split(' ').length/2)).join(' ')}<br><span style="color:var(--gold)">${career.name.split(' ').slice(Math.ceil(career.name.split(' ').length/2)).join(' ')}</span>
      </h1>
      <div class="bc au au2" style="display:inline-block;background:var(--gold);color:var(--navy);font-size:12px;letter-spacing:5px;padding:5px 16px;margin-bottom:52px;font-weight:700">${s.league} · ${s.year}</div>
      <div class="au au3" style="display:flex;gap:40px;flex-wrap:wrap">
        ${[[posLabel(s.position),'Position'],[s.points,'Points'],[s.gf,'Buts marqués'],[s.played,'Matchs']].map(([v,l])=>`
          <div>
            <div class="bb" style="font-size:68px;line-height:1;color:var(--gold)">${v}</div>
            <div class="bc" style="font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:3px;text-transform:uppercase">${l}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `

  // Match dots
  document.getElementById('matches-title').textContent = 'Parcours ' + s.league + ' — ' + s.played + ' matchs'
  document.getElementById('matches-dots').innerHTML = renderDots(s.matches)

  // Big stats
  document.getElementById('big-stats').innerHTML = [
    ['Victoires',s.wins,'var(--green)'],['Nuls',s.draws,'var(--gold)'],
    ['Défaites',s.losses,'var(--red)'],['Buts pour',s.gf,'var(--white)'],
    ['Diff.',gdStr,gdVal>=0?'var(--green)':'var(--red)'],
  ].map(([lbl,val,col])=>`
    <div style="background:var(--blue);padding:22px 18px;border-left:3px solid var(--gold)">
      <div class="bb" style="font-size:50px;line-height:1;color:${col}">${val}</div>
      <div class="bc" style="font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:7px;text-transform:uppercase">${lbl}</div>
    </div>
  `).join('')

  // Performers
  document.getElementById('scorers').innerHTML = renderPerfList('Meilleurs buteurs', s.scorers, 'buts')
  document.getElementById('ratings').innerHTML = renderPerfList('Meilleures notes', s.ratings, 'moy.')
  document.getElementById('assists').innerHTML = renderPerfList('Meilleurs passeurs', s.assists, 'passes D.')
  document.getElementById('mercato-preview').innerHTML = renderMercatoPreview(s, career.id)


  // Cup 2 (ex: UCL)
  if (s.cup2 && s.cup2.rounds && s.cup2.rounds.length) {
    const cup2rows = s.cup2.rounds.map((r,i) => {
      const arrow = i < s.cup2.rounds.length-1 ? '<div style="position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px">›</div>' : ''
      const col = r.result==='W' ? 'var(--green)' : 'var(--red)'
      return '<div style="flex:1 1 130px;text-align:center;padding:18px 8px;border-top:2px solid '+col+';position:relative">'
           + arrow
           + '<div class="bc" style="font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;text-transform:uppercase">'+r.round+'</div>'
           + '<div class="bb" style="font-size:26px;color:'+col+'">'+r.score+'</div>'
           + '<div class="bc" style="font-size:11px;color:var(--muted);margin-top:4px">'+r.opponent+'</div>'
           + '</div>'
    }).join('')
    const phaseHtml = s.cup2.phase ? '<div class="bc" style="font-size:12px;color:var(--muted);margin-bottom:18px;letter-spacing:1px">'+s.cup2.phase+'</div>' : ''
    document.getElementById('cup2-section').innerHTML =
      '<div class="bc sec-title">'+s.cup2.name+'</div>'
      + phaseHtml
      + '<div style="display:flex;flex-wrap:wrap">' + cup2rows + '</div>'
  }

  // Cup
  if (s.cup && s.cup.rounds && s.cup.rounds.length) {
    document.getElementById('cup-section').innerHTML = `
      <div class="bc sec-title">${s.cup.name||'Coupe de France'}</div>
      <div style="display:flex;flex-wrap:wrap">
        ${s.cup.rounds.map((r,i)=>`
          <div style="flex:1 1 130px;text-align:center;padding:18px 8px;border-top:2px solid ${r.result==='W'?'var(--green)':'var(--red)'};position:relative">
            ${i<s.cup.rounds.length-1?`<div style="position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px">›</div>`:''}
            <div class="bc" style="font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;text-transform:uppercase">${r.round}</div>
            <div class="bb" style="font-size:26px;color:${r.result==='W'?'var(--green)':'var(--red)'}">${r.score}</div>
            <div class="bc" style="font-size:11px;color:var(--muted);margin-top:4px">${r.opponent}</div>
          </div>
        `).join('')}
      </div>
    `
  }

  // Playoffs
  if (s.playoffs) {
    const p = s.playoffs
    document.getElementById('playoffs-section').innerHTML = `
      <div style="background:linear-gradient(135deg,rgba(12,34,89,.9),rgba(21,45,114,.4));border:1px solid rgba(232,184,75,.28);padding:26px 36px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <div>
          <div class="bb" style="font-size:24px;color:var(--gold);letter-spacing:3px">${p.competition}</div>
          <div class="bc" style="font-size:12px;color:var(--muted);margin-top:4px">vs ${p.opponent} · ${p.outcome}</div>
        </div>
        <div style="display:flex;gap:28px;align-items:center">
          ${[p.leg1,p.leg2].map(leg=>`
            <div style="text-align:center">
              <div class="bb" style="font-size:42px;color:${leg.result==='W'?'var(--green)':'var(--red)'};line-height:1">${leg.score}</div>
              <div class="bc" style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:4px;text-transform:uppercase">${leg.venue}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `
  }

  // Standings
  if (s.standings && s.standings.length) {
    document.getElementById('standings-section').innerHTML = `<div class="bc sec-title">Classement final</div>${renderStandings(s.standings)}`
  }

  // Promo/Releg
  const hasP = s.promoted && s.promoted.length
  const hasR = s.relegated && s.relegated.length
  if (hasP || hasR) {
    document.getElementById('promo-releg').innerHTML = `
      <div style="display:flex;gap:48px;flex-wrap:wrap;margin-top:8px">
        ${hasP?`<div><div class="bc" style="font-size:9px;letter-spacing:4px;color:var(--green);margin-bottom:10px;text-transform:uppercase;font-weight:700">↑ Promus</div>${s.promoted.map(t=>`<div class="bc" style="font-size:13px;margin-bottom:5px">${t}</div>`).join('')}</div>`:''}
        ${hasR?`<div><div class="bc" style="font-size:9px;letter-spacing:4px;color:var(--red);margin-bottom:10px;text-transform:uppercase;font-weight:700">↓ Relégués</div>${s.relegated.map(t=>`<div class="bc" style="font-size:13px;margin-bottom:5px">${t}</div>`).join('')}</div>`:''}
      </div>
    `
  }
})
</script>
</body>
</html>
