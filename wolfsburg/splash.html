<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LBC FM26</title>
  <link rel="stylesheet" href="../style.css"/>
</head>
<body>
<div id="splash" class="overlay" style="cursor:pointer" onclick="leave()">
  <div class="overlay-grid"></div>
  <div id="content" style="position:relative;text-align:center;padding:0 48px;max-width:820px;opacity:0;transition:opacity .5s ease">
    <div id="sp-eyebrow" class="bc" style="font-size:11px;letter-spacing:8px;color:var(--gold);margin-bottom:36px;font-weight:600"></div>
    <div id="sp-lines"></div>
    <div id="sp-divider" style="height:2px;width:0;background:var(--gold);margin:36px auto;transition:width .55s ease,opacity .55s ease;opacity:0"></div>
    <div id="sp-sub" class="bb" style="font-size:clamp(16px,2.8vw,28px);letter-spacing:6px;color:var(--muted);margin-bottom:18px"></div>
    <div id="sp-tagline" class="bc" style="font-size:clamp(14px,1.8vw,20px);color:var(--white);letter-spacing:2px;font-weight:300;font-style:italic;line-height:1.6"></div>
    <div id="sp-hint" class="bc" style="margin-top:60px;font-size:10px;letter-spacing:5px;color:rgba(106,130,176,.4);opacity:0;transition:opacity .5s">CLIQUER POUR CONTINUER</div>
  </div>
</div>
<script>window.FORCE_CAREER = "wolfsburg"</script>
<script src="../careers.js"></script>
<script src="../seasons-chateauroux.js"></script>
<script src="../seasons-seville.js"></script>
<script src="../seasons-wolfsburg.js"></script>
<script src="../utils.js"></script>
<script>
const id = param('id')
let leaving = false

function leave() {
  if (leaving) return
  leaving = true
  document.getElementById('splash').classList.add('leaving')
  setTimeout(() => { window.location = './saison.html?id=' + id }, 800)
}

loadCareerData(function() {
  const season = getSeason(id)
  if (!season || !season.splash) { window.location = 'saison.html?id=' + (id||''); return; }
  const sp = season.splash

  document.getElementById('sp-eyebrow').textContent = sp.eyebrow
  document.getElementById('sp-sub').textContent = sp.sub
  document.getElementById('sp-tagline').textContent = sp.tagline
  document.getElementById('sp-lines').innerHTML = sp.lines.map((line,i)=>
    `<div class="bb" style="font-size:clamp(56px,10vw,120px);line-height:.9;letter-spacing:3px;color:${i===0?'var(--white)':'var(--gold)'}">${line}</div>`
  ).join('')

  setTimeout(() => { document.getElementById('content').style.opacity = '1' }, 100)
  setTimeout(() => { const d=document.getElementById('sp-divider'); d.style.width='110px'; d.style.opacity='1' }, 600)
  setTimeout(() => { document.getElementById('sp-hint').style.opacity = '1' }, 2200)
  setTimeout(leave, 6000)
  document.title = season.year + ' — FM26'
})
</script>
</body>
</html>
