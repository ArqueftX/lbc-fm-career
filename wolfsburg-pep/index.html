<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FM26 — Wolfsburg (Pep)</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    #career-modal{position:fixed;inset:0;z-index:900;background:rgba(7,17,31,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;}
    #career-modal.open{display:flex;}
    .career-modal-box{background:#0c2259;max-width:480px;width:calc(100% - 40px);padding:36px 32px;border:1px solid rgba(232,184,75,.15);animation:scaleIn .25s ease;}
    .career-item{display:flex;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;border:1px solid transparent;transition:all .18s;margin-bottom:6px;}
    .career-item:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);}
    .career-item.active{border-color:rgba(232,184,75,.4);background:rgba(232,184,75,.06);}
    .career-item img{width:40px;height:40px;object-fit:contain;flex-shrink:0;}
    .switcher-btn{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid rgba(255,255,255,.12);padding:8px 16px;color:var(--muted);font-size:11px;letter-spacing:3px;transition:all .2s;cursor:pointer;}
    .switcher-btn:hover{border-color:rgba(232,184,75,.4);color:var(--gold);}
    .switcher-btn img{width:22px;height:22px;object-fit:contain;}
    @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    .live-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;animation:livePulse 1.6s ease-in-out infinite}
  </style>
</head>
<body>

<!-- CAREER MODAL -->
<div id="career-modal" onclick="if(event.target===this)closeModal()">
  <div class="career-modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
      <div class="bc" style="font-size:10px;letter-spacing:6px;color:var(--gold);font-weight:700">CHANGER DE CARRIÈRE</div>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer">×</button>
    </div>
    <div id="career-list"></div>
  </div>
</div>

<!-- PAGE -->
<div id="page" style="min-height:100vh;background:var(--navy)">
  <div id="header" style="padding:60px 56px 52px;border-bottom:1px solid rgba(232,184,75,.08);position:relative;overflow:hidden">
    <div style="position:absolute;top:0;right:0;width:320px;height:100%;background-image:repeating-linear-gradient(90deg,rgba(77,184,72,.05) 0,rgba(77,184,72,.05) 1px,transparent 1px,transparent 24px);pointer-events:none"></div>
    <div style="max-width:1160px;margin:0 auto">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <div>
          <div class="bc au" style="font-size:10px;letter-spacing:6px;color:var(--gold);margin-bottom:18px;font-weight:600">FOOTBALL MANAGER 26 · CARRIÈRE EN COURS</div>
          <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
            <img id="club-logo" alt="" class="au au1" style="width:110px;height:110px;object-fit:contain;flex-shrink:0"/>
            <div>
              <h1 id="club-name" class="bb au au1" style="font-size:clamp(40px,7vw,80px);line-height:.9;letter-spacing:2px;margin-bottom:16px"></h1>
              <div id="stats-line" class="bc au au2" style="font-size:12px;color:var(--muted);letter-spacing:3px;font-weight:400"></div>
              <div id="coach-badge" class="bc au au3" style="display:none;align-items:center;gap:10px;margin-top:14px;padding:6px 14px;border:1px solid rgba(232,184,75,.2)">
                <span style="font-size:9px;letter-spacing:3px;color:var(--muted);font-weight:700">ENTRAÎNEUR</span>
                <span style="width:1px;height:10px;background:rgba(232,184,75,.25);display:inline-block"></span>
                <span id="coach-name" style="font-size:12px;color:var(--gold);letter-spacing:2px;font-weight:600"></span>
              </div>
            </div>
          </div>
        </div>
        <button onclick="openModal()" class="bc switcher-btn au au4">
          <img id="switcher-logo" alt=""/>
          <span>CARRIÈRES</span>
        </button>
      </div>
    </div>
  </div>

  <div style="max-width:1160px;margin:0 auto;padding:48px 56px 80px">
    <div id="season-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:3px"></div>
  </div>
</div>

<script>window.FORCE_CAREER = "wolfsburg-pep"</script>
<script src="../careers.js"></script>
<script src="../seasons-chateauroux.js"></script>
<script src="../seasons-seville.js"></script>
<script src="../seasons-wolfsburg.js"></script>
<script src="../seasons-wolfsburg-pep.js"></script>
<script src="../seasons-ajax.js"></script>
<script src="../utils.js"></script>
<script>
let career = getCurrentCareer()
function getSeasons() { return window['SEASONS_' + career.id] || [] }

function buildPage() {
  career = getCurrentCareer()
  const seasons = getSeasons()
  const sorted  = [...seasons].sort((a,b) => b.year.localeCompare(a.year))

  document.getElementById('header').style.background = `linear-gradient(160deg, ${career.color}22 0%, var(--navy) 65%)`
  document.getElementById('club-logo').src     = '../' + career.logo
  document.getElementById('switcher-logo').src = '../' + career.logo
  const parts = career.name.split(' ')
  const half  = Math.ceil(parts.length / 2)
  document.getElementById('club-name').innerHTML = `${parts.slice(0,half).join(' ')}<br><span style="color:var(--gold)">${parts.slice(half).join(' ')}</span>`

  // Bilan cumulé (saison en cours)
  const live = liveSummary(seasons[0] || {months:[]})
  document.getElementById('stats-line').innerHTML =
    `SAISON 2025/26 · <span style="color:var(--green)">EN COURS</span> · ${live.played} MATCH${live.played!==1?'S':''} DIRIGÉ${live.played!==1?'S':''}`

  const badge = document.getElementById('coach-badge')
  if (career.coach) { badge.style.display = 'inline-flex'; document.getElementById('coach-name').textContent = career.coach }
  else badge.style.display = 'none'

  document.title = `FM26 — ${career.short}`

  const grid = document.getElementById('season-grid')
  grid.innerHTML = sorted.map((s,i) => buildCard(s,i)).join('')
}

function buildCard(s, i) {
  const ls = leagueStyle(s.league)
  const live = liveSummary(s)
  const winRate = live.played ? Math.round((live.wins/live.played)*100) : 0
  const dots = live.matches.map(m=>`<div style="width:7px;height:7px;border-radius:2px;background:${resultColor(m.r)};opacity:.85"></div>`).join('')
  const posDisplay = live.position != null ? live.position : '—'
  const pct = Math.round((live.played / (s.seasonLength||34)) * 100)
  return `
    <a href="saison.html?id=${s.id}" class="scard au" style="animation-delay:${i*.08}s;display:block">
      <div class="bb" style="position:absolute;right:-8px;bottom:-20px;font-size:140px;color:rgba(255,255,255,.03);line-height:1;pointer-events:none;user-select:none">${posDisplay}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap">
        <div class="bc" style="display:inline-block;background:${ls.bg};border:1px solid ${ls.border};color:${ls.color};font-size:9px;letter-spacing:4px;padding:3px 10px;font-weight:700">${s.league}</div>
        <div class="bc" style="display:inline-flex;align-items:center;gap:6px;background:rgba(61,214,140,.12);border:1px solid var(--green);color:var(--green);font-size:9px;letter-spacing:3px;padding:3px 10px;font-weight:700"><span class="live-dot"></span>EN COURS</div>
      </div>
      <div class="bb" style="font-size:38px;line-height:1;margin-bottom:4px;letter-spacing:1px">${s.year}</div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:22px">
        <span class="bb" style="font-size:66px;color:var(--gold);line-height:1">${posDisplay}</span>
        ${live.position!=null?'<span class="bb" style="font-size:28px">e</span>':''}
        <span class="bc" style="font-size:12px;color:var(--muted)">${live.position!=null?'/'+s.totalTeams:'classement à venir'}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px">
        ${[['Pts',live.points,'var(--goldL)'],['V',live.wins,'var(--green)'],['N',live.draws,'var(--gold)'],['D',live.losses,'var(--red)']].map(([l,v,c])=>`<div><div class="bb" style="font-size:26px;color:${c};line-height:1">${v}</div><div class="bc" style="font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:2px">${l}</div></div>`).join('')}
      </div>
      ${dots ? `<div style="display:flex;flex-wrap:wrap;gap:3px">${dots}</div>` : `<div class="bc" style="font-size:11px;color:var(--muted);letter-spacing:2px;padding:6px 0">Aucun match joué — pré-saison</div>`}
      <div style="margin-top:14px">
        <div style="height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--green);border-radius:2px"></div>
        </div>
        <div class="bc" style="font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:2px">${live.played} / ${s.seasonLength||34} MATCHS · ${winRate}% DE VICTOIRES</div>
      </div>
    </a>`
}

function openModal() {
  document.getElementById('career-modal').classList.add('open')
  const n = id => (window['SEASONS_'+id]||[]).length
  document.getElementById('career-list').innerHTML = window.CAREERS.map(c => `
    <div class="career-item ${c.id===career.id?'active':''}" onclick="switchCareer('${c.id}')">
      <img src="../${c.logo}" onerror="this.style.display='none'"/>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;color:var(--white)">${c.name}${c.coach?'<span style="color:var(--muted);font-weight:400"> - '+c.coach+'</span>':''}</div>
        <div class="bc" style="font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px">${c.country}${c.tag?' · <span style="color:var(--gold)">'+c.tag+'</span>':''} · ${n(c.id)} saison${n(c.id)!==1?'s':''}</div>
      </div>
      ${c.id===career.id?'<div class="bc" style="font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:700">ACTIF</div>':''}
    </div>`).join('')
}
function closeModal() { document.getElementById('career-modal').classList.remove('open') }
function switchCareer(id) { if (id === career.id) { closeModal(); return; } setCurrentCareer(id); window.location = '../' }

buildPage()
</script>
</body>
</html>
